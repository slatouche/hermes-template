# Host settings, shared by every project on this machine. Sourced by the bootstrap scripts (bash).
# Nothing secret goes here: keys are typed in when new-project.sh asks, and land in the project's .env.
# Blank values are detected automatically.

OWNER_NAME="Seb"                       # how the bots refer to you
OWNER_USER=""                          # your admin Linux user (blank = whoever ran sudo); joins each project's group
DISCORD_USER_ID=""                     # your Discord user ID (blank = asked when a Discord token is given)
HOST_LABEL=""                          # blank = the hostname; used in git identities and the SSH alias hint
HOST_ADDR=""                           # blank = the server's first IP address; for the SSH config hint

ROOT="/srv/projects"                   # each project lives at $ROOT/<name>, the home of agent-<name>
USER_PREFIX="agent-"
REGISTRY="$ROOT/registry.yaml"         # name -> num, user, ports (read-only for agents)
LAN_SUBNETS="10.10.10.0/24 192.168.20.0/24"   # app ports are opened to these only (edit for your network)

# Ports: project num NN gets 1NN00-1NN99. 1NN00 = Hermes API server (localhost), 1NN01-1NN99 = apps.

# Model for every bot (OpenCode Go). Hired bots inherit the Manager's settings.
PROVIDER="opencode-go"
BASE_URL="https://opencode.ai/zen/go/v1"
MODEL="deepseek-v4.1-flash"
MODEL_LABEL="DeepSeek V4.1 Flash"
EFFORT="medium"
KEY_VAR="OPENCODE_GO_API_KEY"          # the .env variable holding the provider key
PROVIDER_KEY_FILE=""                   # optional root-only file with a KEY_VAR=... line; blank = asked for each project

# Kanban guardrails
KANBAN_MAX_IN_PROGRESS=2
KANBAN_MAX_PER_PROFILE=1
KANBAN_FAILURE_LIMIT=2
AGENT_MAX_TURNS=150                    # the default profile and the Manager

# Context, learning and limits (reasons and measurements: MultiHermes LEARNINGS.md §5-§9)
COMPRESSION_MANAGER_TOKENS=150000      # compact a Manager chat at this size (DeepSeek's 1M window would wait until ~500K)
COMPRESSION_ROLE_TOKENS=150000         # default for hired roles; a role file can set its own (compression_tokens:)
COMPRESSION_MIN_TAIL_USER=3            # the owner's last 3 messages survive a compaction word for word
SKILL_NUDGE_INTERVAL=30                # tool steps between background skill reviews (Hermes default 10-15)
REVIEW_MAX_INPUT_TOKENS=200000         # cap on what one background review replays (default up to 600K)
CURATOR_STALE_DAYS=30                  # bot-written skills unused this long are marked stale ...
CURATOR_ARCHIVE_DAYS=60                # ... and archived (recoverable) after this long; template skills are never touched
DELEGATION_MAX_CHILDREN=3
DELEGATION_MAX_ITERATIONS=60
DELEGATION_EFFORT="low"
ROLE_MAX_TURNS=90                      # default turn cap for hired roles; a role file can set its own (max_turns:)
ROLE_BUDGET_WARNING=0.8                # warn a bot at 80% of its turn cap

# Toolsets the role bots never get
DISABLED_TOOLSETS='["image_gen","video_gen","computer_use","tts"]'

# Ubuntu packages the projects need (installed once, only if missing):
# tools, plus the libraries the bots' headless Chromium needs for the browser and screenshots.
HOST_PACKAGES="git curl openssl ufw tmux python3 python3-yaml python3-venv ripgrep ffmpeg nodejs npm fonts-liberation \
libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 \
libxdamage1 libxfixes3 libxrandr2 libxi6 libxres1 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libatspi2.0-0t64"
